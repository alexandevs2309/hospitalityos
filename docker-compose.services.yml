services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8081:8081"
    environment:
      DATABASE_URL: postgres://postgres:4CFqpDSBrAfOtZbNsRUi1EgF1@host.docker.internal:5432/hospitality?sslmode=disable
      JWT_SECRET: hospitality-dev-secret-key-2026
      SEED_SECRET: dev-seed
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: always

  frontend:
    build:
      context: ./web
      dockerfile: Dockerfile.frontend
    ports:
      - "3001:3001"
    depends_on:
      - backend
    restart: always
